<style>
  :root{
    --navy-deep:#05112A; --navy:#0B1F3A; --paper:#FFFFFF; --paper-dim:#F5F7FB;
    --line:#E3E8F0; --ink:#0B1F3A; --ink-dim:#5B6B85; --bad:#C7402C;
    --radius-lg:20px; --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  a,button{text-decoration:none;color:inherit;font-family:inherit;}
  button{border:none;background:none;cursor:pointer;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 24px;}
  .hidden{display:none !important;}

  .top{padding:44px 0 8px;display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;object-fit:contain;display:block;
  }
  .brand-name{font-weight:700;font-size:15px;}
  .brand-name span{color:var(--ink-dim);font-weight:500;}

  .heading{padding:36px 0 4px;}
  .heading h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
  .heading p{margin:0;font-size:14px;color:var(--ink-dim);line-height:1.5;}

  form{padding-top:26px;display:flex;flex-direction:column;gap:16px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-dim);display:block;margin-bottom:7px;}
  .field input{
    width:100%;padding:14px 15px;border-radius:var(--radius-sm);
    border:1px solid var(--line);font-size:14.5px;font-family:inherit;
    background:var(--paper-dim);color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--navy);outline-offset:1px;background:var(--paper);}

  .error-box{
    display:none;
    background:#FBE7E3;color:var(--bad);font-size:13px;font-weight:600;
    padding:12px 14px;border-radius:var(--radius-sm);
  }
  .error-box.show{display:block;}

  .btn-primary{
    margin-top:6px;width:100%;padding:15px;border-radius:999px;
    background:var(--navy);color:#fff;font-size:15px;font-weight:700;text-align:center;
  }
  .btn-primary:disabled{background:#B7C0D4;}

  .divider{
    display:flex;align-items:center;gap:10px;margin:26px 0 4px;
    font-size:12px;color:var(--ink-dim);
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB3nxbOJHpJvSV1rrpXUy-RJBo_HG8xW6s",
    authDomain: "past-question-bb34a.firebaseapp.com",
    projectId: "past-question-bb34a",
    storageBucket: "past-question-bb34a.firebasestorage.app",
    messagingSenderId: "949891995843",
    appId: "1:949891995843:web:28b137ac344b2bac31aa76"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("error-box");
  const submitBtn = document.getElementById("submit-btn");

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add("show");
  }

  const FRIENDLY_ERRORS = {
    "auth/invalid-email": "That email address doesn't look right.",
    "auth/user-not-found": "No account found with that email.",
    "auth/wrong-password": "Incorrect password. Try again.",
    "auth/invalid-credential": "Email or password is incorrect.",
    "auth/too-many-requests": "Too many attempts. Please wait a bit and try again."
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    try {
      await auth.signInWithEmailAndPassword(email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      showError(FRIENDLY_ERRORS[err.code] || "Something went wrong. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Log In";
    }
  });

  // If already logged in, skip straight to home
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
